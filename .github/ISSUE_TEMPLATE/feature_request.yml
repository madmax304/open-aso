name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the ASO job, not just the feature. What would you ask your agent?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: How might open-aso help? Note that open-aso focuses on data and skills, not dashboards.
